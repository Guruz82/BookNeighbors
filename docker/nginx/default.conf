server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # App SPA + API sullo stesso host HTTPS: cookie Identity e antiforgery.
    location /api/ { proxy_pass http://api:8080; include /etc/nginx/proxy-headers.conf; }

    # Connessioni WebSocket SignalR.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Endpoint Identity POST /login ma GET /login è una pagina Blazor.
    location = /login {
        error_page 418 = @api_identity;
        if ($request_method = POST) { return 418; }
        try_files $uri /index.html;
    }
    # Endpoint POST /logout ma GET /logout è una pagina Blazor.
    location = /logout {
        error_page 418 = @api_identity;
        if ($request_method = POST) { return 418; }
        try_files $uri /index.html;
    }
    location @api_identity {
        proxy_pass http://api:8080;
        include /etc/nginx/proxy-headers.conf;
    }
    # Endpoint Identity inclusi con MapIdentityApi; non sono pagine SPA.
    location = /refresh { proxy_pass http://api:8080; include /etc/nginx/proxy-headers.conf; }
    location = /confirmEmail { proxy_pass http://api:8080; include /etc/nginx/proxy-headers.conf; }
    location = /resendConfirmationEmail { proxy_pass http://api:8080; include /etc/nginx/proxy-headers.conf; }
    location = /forgotPassword { proxy_pass http://api:8080; include /etc/nginx/proxy-headers.conf; }
    location = /resetPassword { proxy_pass http://api:8080; include /etc/nginx/proxy-headers.conf; }
    location = /manage { proxy_pass http://api:8080; include /etc/nginx/proxy-headers.conf; }
    location /manage/ { proxy_pass http://api:8080; include /etc/nginx/proxy-headers.conf; }

    location /_framework/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }
    location / { try_files $uri $uri/ /index.html; }
}
